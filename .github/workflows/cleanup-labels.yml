name: Cleanup workflow labels

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Remove implementation review label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          issues=$(gh pr view "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number')

          if [ -z "$issues" ]; then
            echo "No closing issue associated with PR #$PR_NUMBER"
            exit 1
          fi

          for issue in $issues; do
            gh issue edit "$issue" \
              --repo "$GH_REPO" \
              --remove-label "implementation-review"
          done
