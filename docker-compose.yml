services:
  postgres:
    image: postgres:17
    container_name: taska-db
    environment:
      POSTGRES_DB: taska
      POSTGRES_USER: taska
      POSTGRES_PASSWORD: taska
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taska"]
      interval: 1s
      timeout: 5s
      retries: 20

  backend:
    build: ./taska-backend
    container_name: taska-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taska
      SPRING_DATASOURCE_USERNAME: taska
      SPRING_DATASOURCE_PASSWORD: taska
      SPRING_PROFILES_ACTIVE: prod

  frontend:
    build: ./taska-frontend
    container_name: taska-frontend
    environment:
      API_URL: http://localhost:8080
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
