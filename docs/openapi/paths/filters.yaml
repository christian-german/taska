"/filters/{id}":
  get:
    tags:
      - "Filters"
    operationId: "getFilter"
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/filter.yaml#/FilterDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Get a filter"
    description: "Get a filter for the authenticated Taska principal."
  put:
    tags:
      - "Filters"
    operationId: "updateFilter"
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/filter.yaml#/FilterRequest"
      required: true
      description: "Request payload."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/filter.yaml#/FilterDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Update a filter"
    description: "Update a filter for the authenticated Taska principal."
  delete:
    tags:
      - "Filters"
    operationId: "deleteFilter"
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    responses:
      "204":
        description: "Operation completed; no response body."
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Delete a filter"
    description: "Delete a filter for the authenticated Taska principal."
"/filters":
  get:
    tags:
      - "Filters"
    operationId: "listFilters"
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              type: "array"
              items:
                "$ref": "../schemas/filter.yaml#/FilterDto"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "List filters"
    description: "List filters for the authenticated Taska principal."
  post:
    tags:
      - "Filters"
    operationId: "createFilter"
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/filter.yaml#/FilterRequest"
      required: true
      description: "Request payload."
    responses:
      "201":
        description: "Resource created."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/filter.yaml#/FilterDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Create a filter"
    description: "Create a filter for the authenticated Taska principal."
"/filters/{id}/tasks":
  get:
    tags:
      - "Filters"
    operationId: "listFilterTasks"
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              type: "array"
              items:
                "$ref": "../schemas/task.yaml#/TaskDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "List tasks matching a filter"
    description: "List tasks matching a filter for the authenticated Taska principal."
