      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "List projects"
    description: "List projects for the authenticated Taska principal."
  post:
    tags:
      - "Projects"
    operationId: "createProject"
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/project.yaml#/ProjectCreateRequest"
      required: true
      description: "Request payload."
    responses:
      "201":
        description: "Resource created."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/project.yaml#/ProjectDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Create a project"
    description: "Create a project for the authenticated Taska principal."
