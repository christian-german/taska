"/projects/{projectId}":
  get:
    tags:
      - "Projects"
    operationId: "getProject"
    parameters:
      - name: "projectId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/project.yaml#/ProjectDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Get a project"
    description: "Get a project for the authenticated Taska principal."
  put:
    tags:
      - "Projects"
    operationId: "updateProject"
    parameters:
      - name: "projectId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/project.yaml#/ProjectUpdateRequest"
      required: true
      description: "Request payload."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/project.yaml#/ProjectDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Update a project"
    description: "Update a project for the authenticated Taska principal."
  delete:
    tags:
      - "Projects"
    operationId: "deleteProject"
    parameters:
      - name: "projectId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    responses:
      "204":
        description: "Operation completed; no response body."
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Delete a project"
    description: "Delete a project for the authenticated Taska principal."
"/projects":
