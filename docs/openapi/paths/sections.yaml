"/sections/{id}":
  get:
    tags:
      - "Sections"
    operationId: "getSection"
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/section.yaml#/SectionDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Get a section"
    description: "Get a section for the authenticated Taska principal."
  put:
    tags:
      - "Sections"
    operationId: "updateSection"
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/section.yaml#/SectionRequest"
      required: true
      description: "Request payload."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/section.yaml#/SectionDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Update a section"
    description: "Update a section for the authenticated Taska principal."
  delete:
    tags:
      - "Sections"
    operationId: "deleteSection"
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    responses:
      "204":
        description: "Operation completed; no response body."
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Delete a section"
    description: "Delete a section for the authenticated Taska principal."
"/sections":
  get:
    tags:
      - "Sections"
    operationId: "listSections"
    parameters:
      - name: "project_id"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "uuid"
        description: "Restrict results to this project identifier."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              type: "array"
              items:
                "$ref": "../schemas/section.yaml#/SectionDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "List sections"
    description: "List sections for the authenticated Taska principal."
  post:
    tags:
      - "Sections"
    operationId: "createSection"
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/section.yaml#/SectionRequest"
      required: true
      description: "Request payload."
    responses:
      "201":
        description: "Resource created."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/section.yaml#/SectionDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Create a section"
    description: "Create a section for the authenticated Taska principal."
