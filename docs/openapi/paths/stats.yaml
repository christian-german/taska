"/stats/overview":
  get:
    tags:
      - "Statistics"
    operationId: "getStatisticsOverview"
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/stats.yaml#/StatsDto"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Get the statistics overview"
    description: "Get the statistics overview for the authenticated Taska principal."
