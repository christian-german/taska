"/tasks/{taskId}":
  get:
    tags:
      - "Tasks"
    operationId: "getTask"
    parameters:
      - name: "taskId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/task.yaml#/TaskResourceDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Get a task"
    description: "Get a task for the authenticated Taska principal."
  put:
    tags:
      - "Tasks"
    operationId: "updateTask"
    parameters:
      - name: "taskId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/task.yaml#/TaskUpdateRequest"
      required: true
      description: "Request payload."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/task.yaml#/TaskResourceDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Update a task"
    description: "Replace a task. Existing recurring series allow common-property edits, but scheduledAt, allDay, isRecurring and recurrenceRule must remain unchanged."
  delete:
    tags:
      - "Tasks"
    operationId: "deleteTask"
    parameters:
      - name: "taskId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Task identifier."
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/task.yaml#/TaskDeleteRequest"
      description: "Request payload."
    responses:
      "204":
        description: "Operation completed; no response body."
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Delete a task"
    description: "Delete a base task, skip one occurrence with THIS_ONLY, or stop recurrence before the supplied occurrence with FROM_THIS. Stopping preserves moved and completed states as detached and creates no successor."
"/tasks/{taskId}/occurrences/{occurrenceScheduledAt}":
  get:
    tags:
      - "Tasks"
    operationId: "getTaskOccurrence"
    parameters:
      - name: "taskId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Recurring-series identifier."
      - name: "occurrenceScheduledAt"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "date-time"
          pattern: "(?:Z|[+-](?:(?:0[0-9]|1[0-7]):[0-5][0-9]|18:00))$"
        description: "Stable original scheduled timestamp of the recurring occurrence."
    responses:
      "200":
        description: "The addressed recurring occurrence."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/task.yaml#/RecurringTaskOccurrenceDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Retrieve one recurring task occurrence"
    description: "Retrieve one generated or detached recurring occurrence by stable identity."
  put:
    tags:
      - "Tasks"
    operationId: "replaceTaskOccurrence"
    parameters:
      - name: "taskId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
      - name: "occurrenceScheduledAt"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "date-time"
          pattern: "(?:Z|[+-](?:(?:0[0-9]|1[0-7]):[0-5][0-9]|18:00))$"
        description: "Original scheduled timestamp of the recurring occurrence."
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/task.yaml#/OccurrenceUpdateRequest"
      required: true
      description: "Request payload."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/task.yaml#/RecurringTaskOccurrenceDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Reschedule one recurring task occurrence"
    description: "Change only scheduledAt, preserving stable identity, completion, detached status and historical customizations. Explicit null restores the original date. Title, priority, dueAt and other fields are rejected."

"/tasks":
  get:
    tags:
      - "Tasks"
    operationId: "listTasks"
    parameters:
      - name: "projectId"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "uuid"
        description: "Restrict results to this project identifier."
      - name: "label"
        in: "query"
        required: false
        schema:
          type: "string"
        description: "Restrict results to tasks carrying this label."
      - name: "showCompleted"
        in: "query"
        required: false
        schema:
          type: "boolean"
          default: false
        description: "Include completed tasks when true."
      - name: "date"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "date"
        description: "Restrict results to one calendar date."
      - name: "from"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "date"
        description: "Inclusive start date of the requested range."
      - name: "to"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "date"
        description: "Inclusive end date of the requested range."
    responses:
      "200":
        description: >-
          Successful response. Without date filters, items are persisted non-recurring tasks or
          recurring-series definitions. With `date`, or with both `from` and `to`, items are
          non-recurring tasks or expanded recurring occurrences; recurring-series definitions are
          not returned.
        content:
          "application/json":
            schema:
              type: "array"
              items:
                "$ref": "../schemas/task.yaml#/TaskDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "List tasks"
    description: >-
      List tasks for the authenticated Taska principal. Supplying `date`, or both `from` and `to`,
      switches the response from task resources to calendar-displayable tasks and expands recurring
      series into occurrences.
  post:
    tags:
      - "Tasks"
    operationId: "createTask"
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/task.yaml#/TaskCreateRequest"
      required: true
      description: "Request payload."
    responses:
      "201":
        description: "Resource created."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/task.yaml#/TaskResourceDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Create a task"
    description: "Create a task for the authenticated Taska principal."
