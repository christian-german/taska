"/time-entries/{id}":
  get:
    tags:
      - "Time Entries"
    operationId: "getTimeEntry"
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/time-entry.yaml#/TimeEntryDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Get a time entry"
    description: "Get a time entry for the authenticated Taska principal."
  put:
    tags:
      - "Time Entries"
    operationId: "updateTimeEntry"
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/time-entry.yaml#/TimeEntryRequest"
      required: true
      description: "Request payload."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/time-entry.yaml#/TimeEntryDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Update a time entry"
    description: "Update a time entry for the authenticated Taska principal."
  delete:
    tags:
      - "Time Entries"
    operationId: "deleteTimeEntry"
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
        description: "Resource identifier."
    responses:
      "204":
        description: "Operation completed; no response body."
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "404":
        "$ref": "../responses.yaml#/NotFound"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Delete a time entry"
    description: "Delete a time entry for the authenticated Taska principal."
"/time-entries":
  get:
    tags:
      - "Time Entries"
    operationId: "listTimeEntries"
    parameters:
      - name: "project_id"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "uuid"
        description: "Restrict results to this project identifier."
      - name: "start"
        in: "query"
        required: false
        schema:
          type: "string"
        description: "Start boundary of the requested time-entry range."
      - name: "end"
        in: "query"
        required: false
        schema:
          type: "string"
        description: "End boundary of the requested time-entry range."
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              type: "array"
              items:
                "$ref": "../schemas/time-entry.yaml#/TimeEntryDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "List time entries"
    description: "List time entries for the authenticated Taska principal."
  post:
    tags:
      - "Time Entries"
    operationId: "createTimeEntry"
    requestBody:
      content:
        "application/json":
          schema:
            "$ref": "../schemas/time-entry.yaml#/TimeEntryRequest"
      required: true
      description: "Request payload."
    responses:
      "201":
        description: "Resource created."
        content:
          "application/json":
            schema:
              "$ref": "../schemas/time-entry.yaml#/TimeEntryDto"
      "400":
        "$ref": "../responses.yaml#/BadRequest"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "409":
        "$ref": "../responses.yaml#/Conflict"
      "422":
        "$ref": "../responses.yaml#/ValidationError"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Create a time entry"
    description: "Create a time entry for the authenticated Taska principal."
