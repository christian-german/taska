"/version":
  get:
    tags:
      - "Version"
    operationId: "getVersion"
    responses:
      "200":
        description: "Successful response."
        content:
          "application/json":
            schema:
              description: "Map containing the running application version under the `version` key."
              type: "object"
              additionalProperties:
                description: "Application version read at startup, or `develop` when no version is configured."
                type: "string"
      "401":
        "$ref": "../responses.yaml#/Unauthorized"
      "403":
        "$ref": "../responses.yaml#/Forbidden"
      "500":
        "$ref": "../responses.yaml#/InternalServerError"
    summary: "Get API version information"
    description: "Get API version information for the authenticated Taska principal."
