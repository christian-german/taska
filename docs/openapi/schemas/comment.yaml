CommentCreateRequest:
  description: "Payload used to create a comment."
  type: "object"
  additionalProperties: false
  properties:
    taskId:
      description: "UUID of the task to attach this comment to."
      type: "string"
      format: "uuid"
    content:
      description: "Required text content of the comment; must not be blank."
      type: "string"
      minLength: 1
  required:
    - "taskId"
    - "content"
CommentUpdateRequest:
  description: "Complete replacement of a comment's mutable properties."
  type: "object"
  additionalProperties: false
  properties:
    content:
      description: "Required replacement text; must not be blank."
      type: "string"
      minLength: 1
  required:
    - "content"
CommentDto:
  description: "Comment returned by the API."
  type: "object"
  properties:
    id:
      description: "Unique identifier of the comment."
      type: "string"
      format: "uuid"
    taskId:
      description: "UUID of the task this comment belongs to."
      type: "string"
      format: "uuid"
    content:
      description: "Text content of the comment."
      type: "string"
    createdAt:
      description: "Timestamp when the comment was created."
      type: "string"
      format: "date-time"
