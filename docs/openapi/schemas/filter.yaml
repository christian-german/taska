FilterRequest:
  description: "Payload used to create or update a saved filter."
  type: "object"
  properties:
    name:
      type: "string"
      minLength: 1
    color:
      type: "string"
    order:
      type: "integer"
      format: "int32"
    isFavorite:
      type: "boolean"
    projectId:
      type: "string"
      format: "uuid"
    clearProject:
      type: "boolean"
    hasDate:
      type: "boolean"
  required:
    - "name"
FilterDto:
  description: "Saved filter returned by the API."
  type: "object"
  properties:
    id:
      type: "string"
      format: "uuid"
    name:
      type: "string"
    color:
      type: "string"
    order:
      type: "integer"
      format: "int32"
    isFavorite:
      type: "boolean"
    projectId:
      type: "string"
      format: "uuid"
    hasDate:
      type: "boolean"
