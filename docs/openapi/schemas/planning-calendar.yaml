PlanningCalendarRequest:
  description: "Payload used to create or update a planning calendar."
  type: "object"
  properties:
    name:
      type: "string"
      minLength: 1
    rules:
      type: "array"
      items:
        "$ref": "./planning-calendar.yaml#/Rule"
  required:
    - "name"
Rule:
  description: "A planning window expressed as weekday and minute offsets."
  type: "object"
  properties:
    dayOfWeek:
      type: "integer"
      format: "int32"
    startMinute:
      type: "integer"
      format: "int32"
    endMinute:
      type: "integer"
      format: "int32"
PlanningCalendarDto:
  description: "Planning calendar returned by the API."
  type: "object"
  properties:
    id:
      type: "string"
      format: "uuid"
    name:
      type: "string"
    rules:
      type: "array"
      items:
        "$ref": "./planning-calendar.yaml#/Rule"
