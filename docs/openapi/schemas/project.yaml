ProjectCreateRequest:
  description: "Payload used to create a project."
  type: "object"
  additionalProperties: false
  properties:
    name:
      description: "Required display name of the project; must not be blank."
      type: "string"
      minLength: 1
    color:
      description: "Hexadecimal color used to display the project; defaults to `#808080` on creation."
      type: ["string", "null"]
    parentId:
      description: "Parent project UUID used to nest this project; null or omission creates a root project."
      type: ["string", "null"]
      format: "uuid"
    order:
      description: "Display position among sibling projects; defaults to 0 on creation."
      type: ["integer", "null"]
      format: "int32"
    isFavorite:
      description: "Whether the project is starred by the user; defaults to false on creation."
      type: ["boolean", "null"]
    viewStyle:
      description: "Preferred task rendering mode; defaults to `LIST` on creation."
      type: ["string", "null"]
      enum:
        - "LIST"
        - "BOARD"
        - "CALENDAR"
        - null
    planningCalendarId:
      description: "Planning calendar assigned to the project; defaults to Taska's built-in calendar on creation."
      type: ["string", "null"]
      format: "uuid"
  required:
    - "name"
ProjectUpdateRequest:
  description: "Complete replacement of a project's mutable properties."
  type: "object"
  additionalProperties: false
  properties:
    name:
      description: "Required replacement display name; must not be blank."
      type: "string"
      minLength: 1
    color:
      description: "Required replacement display color."
      type: "string"
    parentId:
      description: "Required parent selection; null explicitly removes the parent relationship."
      type: ["string", "null"]
      format: "uuid"
    order:
      description: "Required replacement display position among sibling projects."
      type: "integer"
      format: "int32"
    isFavorite:
      description: "Required replacement favorite state."
      type: "boolean"
    viewStyle:
      description: "Required replacement task rendering mode."
      type: "string"
      enum:
        - "LIST"
        - "BOARD"
        - "CALENDAR"
    planningCalendarId:
      description: "Required planning calendar assignment."
      type: "string"
      format: "uuid"
  required:
    - "name"
    - "color"
    - "parentId"
    - "order"
    - "isFavorite"
    - "viewStyle"
    - "planningCalendarId"
ProjectDto:
  description: "Project returned by the API."
  type: "object"
  properties:
    id:
      description: "Unique identifier of the project."
      type: "string"
      format: "uuid"
    name:
      description: "Display name of the project."
      type: "string"
    color:
      description: "Hexadecimal color used to display the project."
      type: "string"
    parentId:
      description: >
        UUID of the parent project for nested or child projects;
        null for root projects.
      type: ["string", "null"]
      format: "uuid"
    order:
      description: "Display position among sibling projects, mapped from the persisted position."
      type: "integer"
      format: "int32"
    isFavorite:
      description: "Whether the project is starred by the user."
      type: "boolean"
    viewStyle:
      description: "Preferred task rendering mode for the project."
      type: "string"
      enum:
        - "LIST"
        - "BOARD"
        - "CALENDAR"
    isInboxProject:
      description: "Whether this is the special default inbox project, which cannot be deleted."
      type: "boolean"
    planningCalendarId:
      description: "Unique identifier of the planning calendar assigned to this project."
      type: "string"
      format: "uuid"
    createdAt:
      description: "Timestamp when the project was first created."
      type: "string"
      format: "date-time"
    updatedAt:
      description: "Timestamp of the project's most recent update."
      type: "string"
      format: "date-time"
ProjectReorderRequest:
  description: "New ordering position for a project."
  type: "object"
  additionalProperties: false
  properties:
    id:
      description: "UUID of the project whose position should be updated."
      type: "string"
      format: "uuid"
    order:
      description: "New display position to assign to the project."
      type: "integer"
      format: "int32"
  required:
    - "id"
    - "order"
