TaskUpdateRequest:
  description: "Complete task update payload."
  type: "object"
  properties:
    content:
      type: "string"
      minLength: 1
    type:
      type: "string"
      enum:
        - "TODO"
        - "APPOINTMENT"
    description:
      type: "string"
    projectId:
      type: "string"
      format: "uuid"
    sectionId:
      type: "string"
      format: "uuid"
    parentId:
      type: "string"
      format: "uuid"
    order:
      type: "integer"
      format: "int32"
    priority:
      type: "integer"
      format: "int32"
      maximum: 4
      minimum: 1
    labels:
      type: "array"
      items:
        type: "string"
    scheduledAt:
      type: "string"
      format: "date-time"
    dueAt:
      type: "string"
      format: "date-time"
    allDay:
      type: "boolean"
    isRecurring:
      type: "boolean"
    estimateMinutes:
      type: "integer"
      format: "int32"
    mentionContext:
      type: "string"
    recurrenceRule:
      type: "string"
  required:
    - "allDay"
    - "content"
    - "description"
    - "dueAt"
    - "estimateMinutes"
    - "isRecurring"
    - "labels"
    - "mentionContext"
    - "order"
    - "parentId"
    - "priority"
    - "projectId"
    - "recurrenceRule"
    - "scheduledAt"
    - "sectionId"
    - "type"
TaskDto:
  description: "Task returned by the API, including recurring occurrence metadata."
  type: "object"
  properties:
    id:
      type: "string"
      format: "uuid"
    content:
      type: "string"
    description:
      type: "string"
    projectId:
      type: "string"
      format: "uuid"
    sectionId:
      type: "string"
      format: "uuid"
    parentId:
      type: "string"
      format: "uuid"
    order:
      type: "integer"
      format: "int32"
    priority:
      type: "integer"
      format: "int32"
    labels:
      type: "array"
      items:
        type: "string"
    isCompleted:
      type: "boolean"
    scheduledAt:
      type: "string"
      format: "date-time"
    dueAt:
      type: "string"
      format: "date-time"
    allDay:
      type: "boolean"
    isRecurring:
      type: "boolean"
    estimateMinutes:
      type: "integer"
      format: "int32"
    mentionContext:
      type: "string"
    recurrenceRule:
      type: "string"
    createdAt:
      type: "string"
      format: "date-time"
    updatedAt:
      type: "string"
      format: "date-time"
    completedAt:
      type: "string"
      format: "date-time"
    instanceId:
      type: "string"
      format: "uuid"
    occurrenceScheduledAt:
      type: "string"
      format: "date-time"
    isVirtual:
      type: "boolean"
    rruleEndsAt:
      type: "string"
      format: "date-time"
    type:
      type: "string"
      enum:
        - "TODO"
        - "APPOINTMENT"
OccurrenceUpdateRequest:
  description: "Changes applied to one recurring task occurrence."
  type: "object"
  properties:
    title:
      type: "string"
      minLength: 1
    priority:
      type: "integer"
      format: "int32"
      maximum: 4
      minimum: 1
    scheduledAt:
      type: "string"
      format: "date-time"
    dueAt:
      type: "string"
      format: "date-time"
  required:
    - "title"
TaskRequest:
  description: "Payload used to create a task."
  type: "object"
  properties:
    content:
      type: "string"
      minLength: 1
    description:
      type: "string"
    projectId:
      type: "string"
      format: "uuid"
    sectionId:
      type: "string"
      format: "uuid"
    parentId:
      type: "string"
      format: "uuid"
    order:
      type: "integer"
      format: "int32"
    priority:
      type: "integer"
      format: "int32"
      maximum: 4
      minimum: 1
    labels:
      type: "array"
      items:
        type: "string"
    scheduledAt:
      type: "string"
      format: "date-time"
    dueAt:
      type: "string"
      format: "date-time"
    allDay:
      type: "boolean"
    isRecurring:
      type: "boolean"
    estimateMinutes:
      type: "integer"
      format: "int32"
      minimum: 0
    mentionContext:
      type: "string"
    recurrenceRule:
      type: "string"
    scope:
      type: "string"
      enum:
        - "THIS_ONLY"
        - "FROM_THIS"
    occurrenceScheduledAt:
      type: "string"
      format: "date-time"
    type:
      type: "string"
      enum:
        - "TODO"
        - "APPOINTMENT"
  required:
    - "content"
TaskCloseReopenRequest:
  description: "Identifies the recurring occurrence affected by a close or reopen operation."
  type: "object"
  properties:
    occurrenceScheduledAt:
      type: "string"
      format: "date-time"
TaskPriorityEvaluationDto:
  description: "Computed priority evaluation for a task."
  type: "object"
  properties:
    taskId:
      type: "string"
      format: "uuid"
    score:
      type: "integer"
      format: "int32"
    components:
      "$ref": "./task.yaml#/PriorityEvaluationComponents"
    computedAt:
      type: "string"
      format: "date-time"
TaskDeleteRequest:
  description: "Controls deletion of a recurring task occurrence or series."
  type: "object"
  properties:
    scope:
      type: "string"
      enum:
        - "THIS_ONLY"
        - "FROM_THIS"
    occurrenceScheduledAt:
      type: "string"
      format: "date-time"
PriorityEvaluationComponents:
  type: "object"
  description: "Extensible details contributing to a priority score."
  additionalProperties: true
