TaskUpdateRequest:
  description: "Complete task update payload."
  type: "object"
  additionalProperties: false
  allOf:
    - if:
        properties:
          isRecurring:
            const: true
        required: ["isRecurring"]
      then:
        properties:
          dueAt:
            type: "null"
  properties:
    content:
      description: "Required title or main text of the task; must not be blank."
      type: "string"
      minLength: 1
    type:
      description: "Kind of commitment represented by the task."
      type: "string"
      enum:
        - "TODO"
        - "APPOINTMENT"
    description:
      description: "Optional longer description of the task."
      type: ["string", "null"]
    projectId:
      description: "UUID of the project to which the task is assigned."
      type: ["string", "null"]
      format: "uuid"
    parentId:
      description: "Parent task UUID when this task is a subtask."
      type: ["string", "null"]
      format: "uuid"
    order:
      description: "Display position within the task's container."
      type: "integer"
      format: "int32"
    priority:
      description: "Optional manual urgency level from 1 (urgent) through 4 (normal)."
      type: ["integer", "null"]
      format: "int32"
      maximum: 4
      minimum: 1
    labels:
      description: "Complete list of label names to attach to the task."
      type: "array"
      items:
        type: "string"
    scheduledAt:
      description: "Planned schedule time in UTC; use no value for an unscheduled task."
      type: ["string", "null"]
      format: "date-time"
    dueAt:
      description: "Deadline in UTC for a non-recurring task; must be null for a recurring series."
      type: ["string", "null"]
      format: "date-time"
    allDay:
      description: "Whether the scheduled time has no specific time component."
      type: "boolean"
    isRecurring:
      description: "Whether the task repeats according to a recurrence rule."
      type: "boolean"
    estimateMinutes:
      description: "Optional estimated duration of the task in minutes."
      type: ["integer", "null"]
      format: "int32"
    mentionContext:
      description: "Raw context captured when the task was created through an @-mention."
      type: ["string", "null"]
    recurrenceRule:
      description: "iCal4j RRULE string describing the task's recurrence pattern."
      type: ["string", "null"]
  required:
    - "allDay"
    - "content"
    - "description"
    - "dueAt"
    - "estimateMinutes"
    - "isRecurring"
    - "labels"
    - "mentionContext"
    - "order"
    - "parentId"
    - "priority"
    - "projectId"
    - "recurrenceRule"
    - "scheduledAt"
    - "type"
FollowingTaskUpdateRequest:
  description: "Complete recurring-series replacement used when splitting from one occurrence."
  allOf:
    - "$ref": "#/TaskUpdateRequest"
    - type: "object"
      properties:
        isRecurring:
          type: "boolean"
          const: true
        dueAt:
          type: "null"
TaskDto:
  description: "Discriminated task resource or recurring-occurrence representation."
  oneOf:
    - "$ref": "#/NonRecurringTaskDto"
    - "$ref": "#/RecurringTaskSeriesDto"
    - "$ref": "#/RecurringTaskOccurrenceDto"
  discriminator:
    propertyName: "kind"
    mapping:
      NON_RECURRING: "#/NonRecurringTaskDto"
      RECURRING_SERIES: "#/RecurringTaskSeriesDto"
      RECURRING_OCCURRENCE: "#/RecurringTaskOccurrenceDto"
TaskResourceDto:
  description: "Persisted task resource returned without occurrence expansion."
  oneOf:
    - "$ref": "#/NonRecurringTaskDto"
    - "$ref": "#/RecurringTaskSeriesDto"
  discriminator:
    propertyName: "kind"
ScheduledTaskDto:
  description: "Displayable task returned by a date or date-range query."
  oneOf:
    - "$ref": "#/NonRecurringTaskDto"
    - "$ref": "#/RecurringTaskOccurrenceDto"
  discriminator:
    propertyName: "kind"
CompletableTaskDto:
  description: "Task or recurring occurrence returned by completion and reopening operations."
  oneOf:
    - "$ref": "#/NonRecurringTaskDto"
    - "$ref": "#/RecurringTaskOccurrenceDto"
  discriminator:
    propertyName: "kind"
TaskBaseDto:
  type: "object"
  properties:
    id:
      description: "Persisted task identifier; for an occurrence, the backing recurring-series identifier."
      type: "string"
      format: "uuid"
    content:
      type: "string"
    description:
      type: ["string", "null"]
    projectId:
      type: ["string", "null"]
      format: "uuid"
    parentId:
      type: ["string", "null"]
      format: "uuid"
    order:
      type: "integer"
      format: "int32"
    priority:
      type: ["integer", "null"]
      format: "int32"
      minimum: 1
      maximum: 4
    labels:
      type: "array"
      items:
        type: "string"
    scheduledAt:
      description: "Effective planned time in UTC."
      type: ["string", "null"]
      format: "date-time"
    allDay:
      type: "boolean"
    estimateMinutes:
      type: ["integer", "null"]
      format: "int32"
    mentionContext:
      type: ["string", "null"]
    createdAt:
      type: ["string", "null"]
      format: "date-time"
    updatedAt:
      type: ["string", "null"]
      format: "date-time"
    type:
      type: "string"
      enum: ["TODO", "APPOINTMENT"]
  required:
    - "id"
    - "content"
    - "description"
    - "projectId"
    - "parentId"
    - "order"
    - "priority"
    - "labels"
    - "scheduledAt"
    - "allDay"
    - "estimateMinutes"
    - "mentionContext"
    - "createdAt"
    - "updatedAt"
    - "type"
NonRecurringTaskDto:
  allOf:
    - "$ref": "#/TaskBaseDto"
    - type: "object"
      properties:
        kind:
          type: "string"
          const: "NON_RECURRING"
        isCompleted:
          type: "boolean"
        completedAt:
          type: ["string", "null"]
          format: "date-time"
        dueAt:
          type: ["string", "null"]
          format: "date-time"
      required: ["kind", "isCompleted", "completedAt", "dueAt"]
RecurringTaskSeriesDto:
  allOf:
    - "$ref": "#/TaskBaseDto"
    - type: "object"
      properties:
        kind:
          type: "string"
          const: "RECURRING_SERIES"
        recurrenceRule:
          type: ["string", "null"]
        rruleEndsAt:
          type: ["string", "null"]
          format: "date-time"
      required: ["kind", "recurrenceRule", "rruleEndsAt"]
RecurringTaskOccurrenceDto:
  allOf:
    - "$ref": "#/TaskBaseDto"
    - type: "object"
      properties:
        kind:
          type: "string"
          const: "RECURRING_OCCURRENCE"
        recurrenceRule:
          type: ["string", "null"]
        rruleEndsAt:
          type: ["string", "null"]
          format: "date-time"
        isCompleted:
          type: "boolean"
        completedAt:
          type: ["string", "null"]
          format: "date-time"
        instanceId:
          description: "Persisted occurrence-instance ID; null while the occurrence is virtual."
          type: ["string", "null"]
          format: "uuid"
        occurrenceScheduledAt:
          description: "Immutable RRULE-generated instant that identifies this occurrence."
          type: "string"
          format: "date-time"
        isVirtual:
          type: "boolean"
        dueAt:
          description: "Occurrence-specific deadline; null when this occurrence has no override."
          type: ["string", "null"]
          format: "date-time"
      required:
        - "kind"
        - "recurrenceRule"
        - "rruleEndsAt"
        - "isCompleted"
        - "completedAt"
        - "instanceId"
        - "occurrenceScheduledAt"
        - "isVirtual"
        - "dueAt"
OccurrenceUpdateRequest:
  description: "Changes applied to one recurring task occurrence."
  type: "object"
  additionalProperties: false
  properties:
    title:
      description: "Required replacement title for this recurring occurrence; must not be blank."
      type: "string"
      minLength: 1
    priority:
      description: "Optional replacement urgency level from 1 (urgent) through 4 (normal)."
      type: ["integer", "null"]
      format: "int32"
      maximum: 4
      minimum: 1
    scheduledAt:
      description: "Optional replacement schedule time in UTC for this occurrence."
      type: ["string", "null"]
      format: "date-time"
    dueAt:
      description: "Optional replacement deadline in UTC for this occurrence."
      type: ["string", "null"]
      format: "date-time"
  required:
    - "title"
TaskCreateRequest:
  description: "Payload used to create a task."
  type: "object"
  additionalProperties: false
  allOf:
    - if:
        properties:
          isRecurring:
            const: true
        required: ["isRecurring"]
      then:
        properties:
          dueAt:
            type: "null"
  properties:
    content:
      description: "Required task title or main text; must not be blank."
      type: "string"
      minLength: 1
    description:
      description: "Optional longer description."
      type: ["string", "null"]
    projectId:
      description: "Project to assign the task to; creation without a project or parent places the task in the inbox."
      type: ["string", "null"]
      format: "uuid"
    parentId:
      description: "Parent task UUID used to create this task as a subtask."
      type: ["string", "null"]
      format: "uuid"
    order:
      description: "Display position within the task's container; defaults to 0 on creation."
      type: ["integer", "null"]
      format: "int32"
    priority:
      description: "Optional manual urgency level from 1 (urgent) through 4 (normal)."
      type: ["integer", "null"]
      format: "int32"
      maximum: 4
      minimum: 1
    labels:
      description: "Label names to attach; replaces the existing label list on update."
      type: ["array", "null"]
      items:
        type: "string"
    scheduledAt:
      description: "Planned schedule time in UTC; use no value for an unscheduled task."
      type: ["string", "null"]
      format: "date-time"
    dueAt:
      description: "Deadline in UTC for a non-recurring task; must be null for a recurring series."
      type: ["string", "null"]
      format: "date-time"
    allDay:
      description: "Whether the scheduled time has no specific time component; defaults to false."
      type: ["boolean", "null"]
    isRecurring:
      description: "Whether the task repeats; defaults to false on creation."
      type: ["boolean", "null"]
    estimateMinutes:
      description: "Optional positive estimated duration of the task in minutes."
      type: ["integer", "null"]
      format: "int32"
      minimum: 1
    mentionContext:
      description: "Raw context captured when the task was created through an @-mention."
      type: ["string", "null"]
    recurrenceRule:
      description: "iCal4j RRULE or shorthand alias (`daily`, `weekly`, `monthly`, or `yearly`), normalized on save."
      type: ["string", "null"]
    type:
      description: "Kind of commitment represented by the task."
      type: ["string", "null"]
      enum:
        - "TODO"
        - "APPOINTMENT"
        - null
  required:
    - "content"
TaskCloseReopenRequest:
  description: "Identifies the recurring occurrence affected by a close or reopen operation."
  type: "object"
  additionalProperties: false
  properties:
    occurrenceScheduledAt:
      description: "UTC instant identifying the recurring occurrence to close or reopen; required for recurring tasks."
      type: ["string", "null"]
      format: "date-time"
TaskPriorityEvaluationDto:
  description: "Computed priority evaluation for a task."
  type: "object"
  properties:
    taskId:
      description: "Unique identifier of the task that was evaluated."
      type: "string"
      format: "uuid"
    score:
      description: "Computed aggregate priority score for the task."
      type: "integer"
      format: "int32"
    components:
      description: "Extensible JSON details describing the factors that contributed to the score."
      "$ref": "./task.yaml#/PriorityEvaluationComponents"
    computedAt:
      description: "Timestamp when the priority evaluation was computed."
      type: "string"
      format: "date-time"
TaskDeleteRequest:
  description: "Controls deletion of a recurring task occurrence or series."
  type: "object"
  additionalProperties: false
  properties:
    scope:
      description: "For a recurring task, skip only this occurrence or truncate the series from this occurrence onward."
      type: ["string", "null"]
      enum:
        - "THIS_ONLY"
        - "FROM_THIS"
    occurrenceScheduledAt:
      description: "UTC instant identifying the recurring occurrence to delete; required when a recurrence scope is supplied."
      type: ["string", "null"]
      format: "date-time"
PriorityEvaluationComponents:
  type: "object"
  description: "Extensible details contributing to a priority score."
  additionalProperties: true
