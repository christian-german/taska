openapi: "3.1.0"
info:
  title: "Taska API"
  version: "1.0.0"
  description: "Spec-first contract for the Taska REST API."
servers:
  - url: "http://localhost:8080"
    description: "Local development"
security:
  - taskaOAuth:
      - "taska"
tags:
  - name: "Tasks"
    description: "Tasks, recurring occurrences, subtasks, and task state transitions."
  - name: "Projects"
    description: "Projects and their ordering and related resources."
  - name: "Planning Calendars"
    description: "Planning calendars and their scheduling rules."
  - name: "Labels"
    description: "Labels used to classify tasks."
  - name: "Comments"
    description: "Comments attached to tasks."
  - name: "Devices"
    description: "Device registration for push notifications."
  - name: "Version"
    description: "API build and version metadata."
paths:
  "/tasks/{taskId}":
    "$ref": "./paths/tasks.yaml#/~1tasks~1{taskId}"
  "/tasks/{taskId}/occurrences/{occurrenceScheduledAt}":
    "$ref": "./paths/tasks.yaml#/~1tasks~1{taskId}~1occurrences~1{occurrenceScheduledAt}"
  "/projects/{projectId}":
    "$ref": "./paths/projects.yaml#/~1projects~1{projectId}"
  "/planning-calendars/{planningCalendarId}":
    "$ref": "./paths/planning-calendars.yaml#/~1planning-calendars~1{planningCalendarId}"
  "/labels/{labelId}":
    "$ref": "./paths/labels.yaml#/~1labels~1{labelId}"
  "/comments/{commentId}":
    "$ref": "./paths/comments.yaml#/~1comments~1{commentId}"
  "/tasks":
    "$ref": "./paths/tasks.yaml#/~1tasks"
  "/tasks/{taskId}/reopen":
    "$ref": "./paths/tasks.yaml#/~1tasks~1{taskId}~1reopen"
  "/tasks/{taskId}/close":
    "$ref": "./paths/tasks.yaml#/~1tasks~1{taskId}~1close"
  "/register-device":
    "$ref": "./paths/devices.yaml#/~1register-device"
  "/projects":
    "$ref": "./paths/projects.yaml#/~1projects"
  "/planning-calendars":
    "$ref": "./paths/planning-calendars.yaml#/~1planning-calendars"
  "/labels":
    "$ref": "./paths/labels.yaml#/~1labels"
  "/comments":
    "$ref": "./paths/comments.yaml#/~1comments"
  "/projects/reorder":
    "$ref": "./paths/projects.yaml#/~1projects~1reorder"
  "/version":
    "$ref": "./paths/version.yaml#/~1version"
  "/tasks/{taskId}/subtasks":
    "$ref": "./paths/tasks.yaml#/~1tasks~1{taskId}~1subtasks"
  "/tasks/{taskId}/priority-evaluation":
    "$ref": "./paths/tasks.yaml#/~1tasks~1{taskId}~1priority-evaluation"
  "/projects/{projectId}/tasks":
    "$ref": "./paths/projects.yaml#/~1projects~1{projectId}~1tasks"
components:
  securitySchemes:
    taskaOAuth:
      "$ref": "./security.yaml#/taskaOAuth"
  schemas:
    TaskUpdateRequest:
      "$ref": "./schemas/task.yaml#/TaskUpdateRequest"
    TaskDto:
      "$ref": "./schemas/task.yaml#/TaskDto"
    TaskResourceDto:
      "$ref": "./schemas/task.yaml#/TaskResourceDto"
    ScheduledTaskDto:
      "$ref": "./schemas/task.yaml#/ScheduledTaskDto"
    CompletableTaskDto:
      "$ref": "./schemas/task.yaml#/CompletableTaskDto"
    NonRecurringTaskDto:
      "$ref": "./schemas/task.yaml#/NonRecurringTaskDto"
    RecurringTaskSeriesDto:
      "$ref": "./schemas/task.yaml#/RecurringTaskSeriesDto"
    RecurringTaskOccurrenceDto:
      "$ref": "./schemas/task.yaml#/RecurringTaskOccurrenceDto"
    OccurrenceUpdateRequest:
      "$ref": "./schemas/task.yaml#/OccurrenceUpdateRequest"
    ProjectCreateRequest:
      "$ref": "./schemas/project.yaml#/ProjectCreateRequest"
    ProjectUpdateRequest:
      "$ref": "./schemas/project.yaml#/ProjectUpdateRequest"
    ProjectDto:
      "$ref": "./schemas/project.yaml#/ProjectDto"
    PlanningCalendarCreateRequest:
      "$ref": "./schemas/planning-calendar.yaml#/PlanningCalendarCreateRequest"
    PlanningCalendarUpdateRequest:
      "$ref": "./schemas/planning-calendar.yaml#/PlanningCalendarUpdateRequest"
    Rule:
      "$ref": "./schemas/planning-calendar.yaml#/Rule"
    PlanningCalendarDto:
      "$ref": "./schemas/planning-calendar.yaml#/PlanningCalendarDto"
    LabelCreateRequest:
      "$ref": "./schemas/label.yaml#/LabelCreateRequest"
    LabelUpdateRequest:
      "$ref": "./schemas/label.yaml#/LabelUpdateRequest"
    LabelDto:
      "$ref": "./schemas/label.yaml#/LabelDto"
    CommentCreateRequest:
      "$ref": "./schemas/comment.yaml#/CommentCreateRequest"
    CommentUpdateRequest:
      "$ref": "./schemas/comment.yaml#/CommentUpdateRequest"
    CommentDto:
      "$ref": "./schemas/comment.yaml#/CommentDto"
    TaskCreateRequest:
      "$ref": "./schemas/task.yaml#/TaskCreateRequest"
    TaskCloseReopenRequest:
      "$ref": "./schemas/task.yaml#/TaskCloseReopenRequest"
    RegisterDeviceRequest:
      "$ref": "./schemas/device.yaml#/RegisterDeviceRequest"
    ProjectReorderRequest:
      "$ref": "./schemas/project.yaml#/ProjectReorderRequest"
    PriorityEvaluationComponents:
      "$ref": "./schemas/task.yaml#/PriorityEvaluationComponents"
    TaskPriorityEvaluationDto:
      "$ref": "./schemas/task.yaml#/TaskPriorityEvaluationDto"
    TaskDeleteRequest:
      "$ref": "./schemas/task.yaml#/TaskDeleteRequest"
    ProblemDetails:
      "$ref": "./schemas/error.yaml#/ProblemDetails"
    Violation:
      "$ref": "./schemas/error.yaml#/Violation"
  responses:
    BadRequest:
      "$ref": "./responses.yaml#/BadRequest"
    Unauthorized:
      "$ref": "./responses.yaml#/Unauthorized"
    Forbidden:
      "$ref": "./responses.yaml#/Forbidden"
    NotFound:
      "$ref": "./responses.yaml#/NotFound"
    Conflict:
      "$ref": "./responses.yaml#/Conflict"
    ValidationError:
      "$ref": "./responses.yaml#/ValidationError"
    InternalServerError:
      "$ref": "./responses.yaml#/InternalServerError"
