version: 1
metadata:
  name: taska-setup
entries:
  - model: authentik_core.user
    state: present
    identifiers:
      username: user
    attrs:
      username: user
      name: Taska User
      email: user@taska.local
      is_active: true
      password: pass

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: taska-provider
    attrs:
      name: taska-provider
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_id: taska-client
      client_type: public
      allowed_origins:
        - http://localhost:4200
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:4200/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: taska
    attrs:
      name: taska
      slug: taska
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, taska-provider]]
