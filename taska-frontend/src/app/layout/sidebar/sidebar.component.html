<aside class="sb desktop-only scroll" style="overflow-y: auto;">
  <div class="sb-head">
    <div class="script" style="font-size: 30px; line-height: 1; color: var(--ink); position: relative;">
      taska
      <svg width="56" height="8" viewBox="0 0 56 8" style="display: block; margin-top: 2px;">
        <path d="M2 5 Q 8 1, 14 5 T 26 5 T 38 5 T 50 5"
              stroke="var(--orange)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="sb-group">
    <a routerLink="/today" routerLinkActive="active" class="sb-link">
      <span class="dot dot-today"></span>
      <span>Today</span>
    </a>
    <a routerLink="/upcoming" routerLinkActive="active" class="sb-link">
      <span class="dot dot-upcoming"></span>
      <span>Upcoming</span>
    </a>
    <a routerLink="/filters" routerLinkActive="active" class="sb-link">
      <span class="dot dot-filters"></span>
      <span>Filters</span>
    </a>
    <a routerLink="/labels" routerLinkActive="active" class="sb-link">
      <span class="dot dot-labels"></span>
      <span>Labels</span>
    </a>
  </div>

  <div class="sb-sep"></div>

  <div class="sb-subhead">Projects</div>
  <div class="sb-group">
    @for (project of projects(); track project.id) {
      @if (!project.parentId && !project.isInboxProject) {
        <div class="project-wrap">
          <a [routerLink]="['/project', project.id]" routerLinkActive="active" class="sb-link">
            <span class="dot" [style.background]="getColor(project.color)"></span>
            <span>{{ project.name }}</span>
          </a>
          @for (child of getChildren(project.id); track child.id) {
            <a [routerLink]="['/project', child.id]" routerLinkActive="active" class="sb-link child-link">
              <span class="dot child-dot" [style.background]="getColor(child.color)"></span>
              <span>{{ child.name }}</span>
            </a>
          }
        </div>
      }
    }
  </div>
</aside>
